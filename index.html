<title>Cronoviaggio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@400;600&display=swap">
<style>
/* Layout: gioco a tutto schermo; interfaccia come un codice miniato
   — pannelli blu lapislazzulo, filetti d'oro, capitali romane per i titoli. */
:root {
  --lapis: #131b33;         /* fondo dei pannelli */
  --lapis-2: #1c2748;       /* pannelli rialzati */
  --gold: #d2a94e;          /* foglia d'oro: accento */
  --gold-soft: #8d7340;     /* filetti */
  --vellum: #f1e7d0;        /* testo principale */
  --vellum-dim: #b9b09c;    /* testo secondario */
  --porpora: #8e2f3a;       /* rubrica: avvisi, parole del glossario */
  --verde: #5f8f4e;         /* risposta giusta */
  --ink: #0b0f1d;           /* ombre */
  --f-display: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --f-body: 'Atkinson Hyperlegible', 'Verdana', system-ui, sans-serif;
  --fs: 19px;
  --radius: 3px;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--vellum); font-family: var(--f-body); font-size: var(--fs); overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: none; }
body.font-lexend { --f-body: 'Lexend', 'Verdana', system-ui, sans-serif; }
body.size-l { --fs: 22px; } body.size-xl { --fs: 26px; }
#game { position: fixed; inset: 0; }
#game canvas { display: block; width: 100%; height: 100%; cursor: grab; }
#game canvas:active { cursor: grabbing; }
.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(5,6,12,.55) 100%); }
button { font: inherit; color: inherit; }
.btn { min-height: 44px; background: var(--lapis-2); border: 1px solid var(--gold-soft); color: var(--vellum); padding: .55em 1.1em; border-radius: var(--radius); cursor: pointer; font-family: var(--f-body); font-size: .95em; display: inline-flex; align-items: center; gap: .45em; transition: background .15s, border-color .15s, transform .1s; }
.btn:hover { border-color: var(--gold); background: #24305a; }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, .gl:focus-visible, .opt:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btn.primary { background: var(--gold); color: var(--ink); border-color: var(--gold); font-weight: 700; }
.btn.primary:hover { background: #e2bc63; }
.btn.ghost { background: transparent; }
.btn svg { width: 1.1em; height: 1.1em; }
.panel { background: linear-gradient(180deg, rgba(28,39,72,.96), rgba(19,27,51,.97)); border: 1px solid var(--gold-soft); box-shadow: 0 0 0 4px rgba(19,27,51,.6), 0 0 0 5px rgba(210,169,78,.35), 0 18px 50px rgba(0,0,0,.55); border-radius: var(--radius); }
.cap { font-family: var(--f-display); letter-spacing: .08em; }
.eyebrow { font-family: var(--f-display); font-size: .7em; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
[hidden] { display: none !important; }

/* HUD */
#hud { position: fixed; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
#topbar { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 16px; right: 16px; display: flex; align-items: flex-start; gap: 16px; pointer-events: none; }
#topbar > * { pointer-events: auto; }
#epochTag { padding: .5em .9em; min-width: 0; }
#epochTag .yr { font-family: var(--f-display); font-size: 1.35em; color: var(--gold); line-height: 1; }
#epochTag .pl { font-size: .72em; color: var(--vellum-dim); margin-top: .25em; }
#timeline { flex: 1; min-width: 0; position: relative; height: 46px; padding: 0 12px; }
#timeline .line { position: absolute; left: 12px; right: 12px; top: 18px; height: 2px; background: linear-gradient(90deg, var(--gold-soft), var(--gold), var(--gold-soft)); opacity: .7; }
#timeline .mk { position: absolute; top: 12px; width: 14px; height: 14px; margin-left: -7px; transform: rotate(45deg); border: 1px solid var(--gold); background: var(--lapis); }
#timeline .mk.done { background: var(--gold); }
#timeline .mk.cur { background: var(--vellum); box-shadow: 0 0 12px var(--gold); }
#timeline .lbl { position: absolute; top: 30px; font-size: .62em; color: var(--vellum-dim); transform: translateX(-50%); font-variant-numeric: tabular-nums; white-space: nowrap; }
#tools { display: flex; gap: 8px; }
.iconbtn { width: 46px; height: 46px; padding: 0; justify-content: center; }
#goals { position: absolute; left: 16px; top: calc(env(safe-area-inset-top, 0px) + 92px); padding: .7em .9em; max-width: min(320px, 60vw); font-size: .8em; }
#goals h3 { margin: 0; font-size: 1em; }
#goalToggle { all: unset; cursor: pointer; display: flex; align-items: center; gap: .5em; width: 100%; min-height: 32px; font-family: var(--f-display); font-size: .9em; color: var(--gold); letter-spacing: .06em; }
#goalToggle:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
#goalToggle .n { margin-left: auto; font-family: var(--f-body); color: var(--vellum-dim); font-variant-numeric: tabular-nums; }
#goalToggle svg { width: 1em; height: 1em; transition: transform .2s; }
#goals.closed #goalToggle svg { transform: rotate(-90deg); }
#goals ul { margin-top: .4em !important; }
#goals.closed ul { display: none; }
body.size-l #goals { top: calc(env(safe-area-inset-top, 0px) + 100px); } body.size-xl #goals { top: calc(env(safe-area-inset-top, 0px) + 112px); }
body.talking #goals, body.talking #compass, body.talking #thought { visibility: hidden; }
#goals ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .3em; }
#goals li { display: flex; gap: .5em; align-items: baseline; }
#goals li::before { content: ''; flex: none; width: .55em; height: .55em; border: 1px solid var(--gold); transform: rotate(45deg) translateY(-1px); }
#goals li.ok { color: var(--vellum-dim); text-decoration: line-through; }
#goals li.ok::before { background: var(--gold); }
#compass { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 70px); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: .5em; font-size: .75em; padding: .3em .8em; pointer-events: none; }
#compass .arrow { width: 26px; height: 26px; color: var(--gold); transition: transform .1s; }
#prompt { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translateX(-50%); padding: .6em 1.2em; font-size: .9em; display: flex; gap: .6em; align-items: center; cursor: pointer; white-space: nowrap; max-width: calc(100vw - 32px); }
#prompt kbd { font-family: var(--f-body); background: var(--gold); color: var(--ink); padding: .05em .5em; border-radius: 2px; font-weight: 700; }
#thought { position: absolute; left: 50%; top: 28%; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); padding: .9em 1.2em; font-style: italic; text-align: center; font-size: .92em; pointer-events: none; transition: opacity .4s; }
#thought .who { display: block; font-style: normal; margin-bottom: .2em; }
#crosshair { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: rgba(241,231,208,.6); pointer-events: none; }

/* Dialogo */
#dialog { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); transform: translateX(-50%); width: min(820px, calc(100vw - 32px)); padding: 1.1em 1.4em 1em; }
#dialog .who { display: flex; align-items: baseline; gap: .7em; flex-wrap: wrap; margin-bottom: .5em; }
#dialog .name { font-family: var(--f-display); font-size: 1.15em; color: var(--gold); font-weight: 700; letter-spacing: .04em; }
#dialog .role { font-size: .75em; color: var(--vellum-dim); }
#dialog .text { line-height: 1.55; min-height: 3.2em; max-width: 70ch; }
#dialog .text.me { font-style: italic; color: #d9e2f6; }
#dialog .row { display: flex; justify-content: space-between; align-items: center; margin-top: .8em; gap: .6em; flex-wrap: wrap; }
#dialog .dots { display: flex; gap: 5px; }
#dialog .dots i { width: 7px; height: 7px; transform: rotate(45deg); border: 1px solid var(--gold-soft); }
#dialog .dots i.on { background: var(--gold); border-color: var(--gold); }
.gl { background: none; border: none; padding: .12em 0; min-height: 1.6em; color: #f0c477; border-bottom: 2px dotted var(--porpora); cursor: help; font: inherit; font-weight: 700; }
#glossTip { position: fixed; z-index: 30; width: min(340px, calc(100vw - 32px)); padding: .8em 1em; font-size: .85em; line-height: 1.45; }
#glossTip b { font-family: var(--f-display); color: var(--gold); display: block; margin-bottom: .2em; letter-spacing: .04em; }

/* Schermate */
.screen { position: fixed; inset: 0; display: flex; padding: 16px; overflow-y: auto; z-index: 20; }
.screen > * { margin: auto; }
.screen.dim { background: rgba(8,10,20,.55); backdrop-filter: blur(3px); }
#title { background: linear-gradient(180deg, rgba(8,10,20,.15) 0%, rgba(8,10,20,.05) 40%, rgba(8,10,20,.85) 100%); }
#title .inner { margin: auto auto 0; }
#title .inner { width: min(980px, 100%); display: grid; gap: 1.2em; padding-bottom: 6vh; }
#title h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(2.6rem, 9vw, 6.4rem); margin: 0; line-height: .9; letter-spacing: .04em; color: var(--vellum); text-shadow: 0 4px 30px rgba(0,0,0,.6); }
#title h1 span { color: var(--gold); }
#title .sub { font-size: clamp(1rem, 2.4vw, 1.3rem); max-width: 46ch; color: var(--vellum); text-shadow: 0 2px 12px rgba(0,0,0,.8); line-height: 1.45; }
#title .dates { font-family: var(--f-display); color: var(--gold); letter-spacing: .3em; font-size: .9em; }
#title .actions { display: flex; flex-wrap: wrap; gap: .7em; align-items: center; }
#title input { font: inherit; background: rgba(19,27,51,.85); border: 1px solid var(--gold-soft); color: var(--vellum); padding: .55em .9em; border-radius: var(--radius); width: 15em; max-width: 100%; }
#title label { font-size: .85em; color: var(--vellum-dim); display: grid; gap: .3em; }
.card { width: min(680px, 100%); padding: 1.6em 1.8em; display: grid; gap: .9em; }
.card h2 { font-family: var(--f-display); margin: 0; font-size: clamp(1.5rem, 4vw, 2.1rem); color: var(--vellum); line-height: 1.15; text-wrap: balance; font-weight: 700; }
.card .bigyear { font-family: var(--f-display); font-size: clamp(3rem, 12vw, 5.5rem); color: var(--gold); line-height: .9; font-weight: 700; }
.card .bigyear small { font-size: .3em; letter-spacing: .2em; margin-left: .3em; }
.card p { margin: 0; line-height: 1.6; max-width: 62ch; }
.card .row { display: flex; gap: .7em; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.card .row.split { justify-content: space-between; }
.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: .6em; font-size: .8em; color: var(--vellum-dim); }
.howto div { border-top: 1px solid var(--gold-soft); padding-top: .5em; }
.howto b { color: var(--vellum); display: block; }
/* Quiz */
#quiz .q { font-size: 1.1em; line-height: 1.5; }
#quiz .opts { display: grid; gap: .6em; }
.opt { text-align: left; background: var(--lapis); border: 1px solid var(--gold-soft); padding: .75em 1em; border-radius: var(--radius); cursor: pointer; line-height: 1.4; display: flex; gap: .8em; align-items: baseline; }
.opt:hover { border-color: var(--gold); }
.opt .l { font-family: var(--f-display); color: var(--gold); font-weight: 700; }
.opt.right { background: #26402a; border-color: var(--verde); }
.opt.wrong { background: #3d1e24; border-color: var(--porpora); animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.feedback { padding: .7em 1em; border-left: 3px solid var(--gold); background: rgba(210,169,78,.08); line-height: 1.5; }
.feedback.bad { border-color: var(--porpora); background: rgba(142,47,58,.12); }
.progress { display: flex; gap: 6px; }
.progress i { width: 10px; height: 10px; transform: rotate(45deg); border: 1px solid var(--gold); }
.progress i.on { background: var(--gold); }
/* Diario */
#diary .card { width: min(900px, 100%); max-height: calc(100vh - 32px); overflow: hidden; grid-template-rows: auto auto 1fr auto; }
.tabs { display: flex; gap: .4em; border-bottom: 1px solid var(--gold-soft); flex-wrap: wrap; }
.tabs button { background: none; border: none; border-bottom: 3px solid transparent; padding: .5em .9em; cursor: pointer; color: var(--vellum-dim); font-family: var(--f-display); letter-spacing: .05em; }
.tabs button[aria-selected="true"] { color: var(--gold); border-color: var(--gold); }
.dscroll { overflow-y: auto; min-height: 0; padding-right: .3em; }
.relics { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: .9em; }
.relic { background: var(--lapis); border: 1px solid var(--gold-soft); border-radius: var(--radius); overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
.relic img, .relic .ph { width: 100%; aspect-ratio: 4/3; display: block; background: radial-gradient(circle at 50% 40%, #2c3a66, #10162a); object-fit: cover; }
.relic .ph { display: grid; place-items: center; color: var(--gold-soft); font-family: var(--f-display); font-size: 2em; }
.relic .tx { padding: .6em .8em; font-size: .78em; line-height: 1.45; }
.relic .tx b { display: block; font-size: 1.1em; color: var(--gold); margin-bottom: .2em; }
.relic .tx .yr { color: var(--vellum-dim); font-size: .9em; }
.relic.locked { opacity: .45; }
.words { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: .5em 1.4em; }
.words div { border-bottom: 1px solid rgba(141,115,64,.4); padding: .45em 0; font-size: .85em; line-height: 1.45; }
.words b { color: var(--gold); font-family: var(--f-display); letter-spacing: .03em; }
.epochs { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: .7em; }
.ep { text-align: left; background: var(--lapis); border: 1px solid var(--gold-soft); border-radius: var(--radius); padding: .8em 1em; cursor: pointer; display: grid; gap: .2em; }
.ep:hover:not([disabled]) { border-color: var(--gold); }
.ep[disabled] { opacity: .4; cursor: not-allowed; }
.ep .y { font-family: var(--f-display); color: var(--gold); font-size: 1.3em; font-weight: 700; }
.ep .t { font-weight: 700; }
.ep .p { font-size: .78em; color: var(--vellum-dim); }
.ep .st { font-size: .75em; color: var(--gold); }
/* Impostazioni */
.set { display: grid; grid-template-columns: 1fr auto; gap: .6em 1.2em; align-items: center; font-size: .9em; }
.set select, .set input[type=range] { font: inherit; background: var(--lapis); color: var(--vellum); border: 1px solid var(--gold-soft); border-radius: var(--radius); padding: .3em .5em; max-width: 52vw; }
.set input[type=checkbox] { width: 1.7em; height: 1.7em; accent-color: var(--gold); }
.set select { min-height: 44px; } .set input[type=range] { min-height: 36px; width: 12em; }
.seg { display: inline-flex; border: 1px solid var(--gold-soft); border-radius: var(--radius); overflow: hidden; }
.seg button { all: unset; cursor: pointer; padding: .55em 1em; min-height: 44px; display: inline-flex; align-items: center; background: rgba(19,27,51,.85); color: var(--vellum-dim); font-family: var(--f-body); }
.seg button[aria-pressed="true"] { background: var(--gold); color: var(--ink); font-weight: 700; }
.seg button:focus-visible { outline: 2px solid var(--vellum); outline-offset: -3px; }
/* Finale: linea del tempo da riordinare e attestato */
.ordered { display: grid; gap: .45em; counter-reset: n; padding: 0; margin: 0; list-style: none; }
.ordered li, .pool button { display: flex; gap: .7em; align-items: center; padding: .6em .9em; min-height: 48px; border: 1px solid var(--gold-soft); border-radius: var(--radius); background: var(--lapis); line-height: 1.35; text-align: left; }
.ordered li { counter-increment: n; cursor: pointer; }
.ordered li::before { content: counter(n); font-family: var(--f-display); color: var(--gold); min-width: 1.4em; font-weight: 700; }
.ordered li.ok { border-color: var(--verde); background: #22382a; } .ordered li.no { border-color: var(--porpora); background: #3a1e24; }
.ordered li .yr { margin-left: auto; font-family: var(--f-display); color: var(--gold); font-weight: 700; }
.ordered li.empty { border-style: dashed; color: var(--vellum-dim); cursor: default; }
.pool { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .45em; }
.pool button { cursor: pointer; color: var(--vellum); font: inherit; }
.pool button:hover { border-color: var(--gold); }
#cert { width: 100%; max-width: 900px; height: auto; display: block; border-radius: 2px; box-shadow: 0 18px 50px rgba(0,0,0,.55); }
.ep.final { grid-column: 1 / -1; border-color: var(--gold); background: linear-gradient(90deg, rgba(210,169,78,.18), var(--lapis)); }
.set .hint { grid-column: 1 / -1; font-size: .8em; color: var(--vellum-dim); margin-top: -.4em; }
/* Reperto trovato */
#found { position: fixed; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 72px); width: min(330px, calc(100vw - 32px)); padding: .9em; display: grid; grid-template-columns: 96px 1fr; gap: .8em; align-items: center; z-index: 15; animation: rise .5s ease-out; }
#found img { width: 96px; height: 96px; border: 1px solid var(--gold-soft); background: radial-gradient(circle at 50% 40%, #2c3a66, #10162a); }
#found b { color: var(--gold); display: block; font-family: var(--f-display); }
#found small { color: var(--vellum-dim); font-size: .75em; }
@keyframes rise { from { transform: translateY(30px); opacity: 0; } }
/* Caricamento */
#loading { background: var(--ink); z-index: 40; text-align: center; }
.hourglass { width: 54px; height: 54px; color: var(--gold); animation: turn 2.4s ease-in-out infinite; margin: 0 auto 1em; }
@keyframes turn { 0%, 40% { transform: rotate(0); } 60%, 100% { transform: rotate(180deg); } }
#loading p { font-family: var(--f-display); letter-spacing: .15em; color: var(--vellum-dim); }
/* Joystick touch */
#stick { position: fixed; width: 120px; height: 120px; margin: -60px; border-radius: 50%; border: 2px solid rgba(210,169,78,.6); background: rgba(19,27,51,.35); pointer-events: none; z-index: 5; }
#stick i { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px; border-radius: 50%; background: rgba(210,169,78,.65); }
.fade { position: fixed; inset: 0; background: #fff6dc; pointer-events: none; opacity: 0; transition: opacity .9s; z-index: 35; }
.fade.on { opacity: 1; }
@media (max-width: 640px) {
  #title { background: linear-gradient(180deg, rgba(8,10,20,.25), rgba(8,10,20,.7) 30%, rgba(8,10,20,.93)); }
  #timeline .lbl { display: none; } #goals { top: calc(env(safe-area-inset-top, 0px) + 74px); font-size: .76em; max-width: min(300px, calc(100vw - 32px)); }
  #epochTag .pl { display: none; } .iconbtn { width: 46px; height: 46px; }
  #compass { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 86px); }
  #found { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

a, prima sorgeva un [[tempio]] dedicato al dio Apollo.","Per vivere insieme serve un ordine. Per questo ho scritto una [[regola]]: quando si prega, quando si lavora, quando si mangia e si dorme. Il suo cuore sta in due parole: [[ora et labora]], prega e lavora.","Il mondo fuori \xE8 stanco: pochi abitanti, campi abbandonati, nessuna legge sicura. Noi vogliamo essere un luogo di pace, di lavoro e di studio. Vai in chiesa: sul leggio troverai la nostra Regola."]}),o.glossary({529:"L\u2019anno in cui Benedetto da Norcia fonda il monastero di Montecassino, il primo dei monasteri benedettini."}),o.zone({x:0,z:K+14,r:5,text:"Delle mura in cima al monte, una porta ad arco\u2026 e sopra c\u2019\xE8 scritto PAX, cio\xE8 \xABpace\xBB in latino."});for(let p=0;p<8;p++){let g=Ut(),v=19+p%4*2.6+i()*1.5,G=K-4+Math.floor(p/4)*6+i()*2;g.position.set(v,o.groundHeight(v,G),G),g.rotation.y=i()*6,a.add(g),o.collideCircle(v,G,.6);let E=i()*10;o.onUpdate((U,ce)=>{g.userData.head.rotation.z=-.6+Math.sin(ce*.6+E)*.5,g.userData.head.position.y=.7+Math.sin(ce*.6+E)*.08})}{let p=new e.PlaneGeometry(25.6,21.6,1,1);p.rotateX(-Math.PI/2);let g=new e.Mesh(p,X("dirt",{tone:"#8a7656",repeat:5}));g.position.set(0,F+.03,K),g.receiveShadow=!0,a.add(g)}wa(o,9,F+4.7,K-2,{scale:.25,intensity:0,logs:!1}),o.portal(0,K+7.5)}};import{mergeGeometries as zi}from"three/addons/utils/BufferGeometryUtils.js";var ct=-33,Xa=-24,Ha=-4,kn={x:-50,z:-12},Zo={x:-13,z:16},go={x0:8,x1:34,z0:1,z1:15};function Wn(o,e){let t=(Mo(o*.04+3,e*.04,3)-.5)*.5,a=ro(Xa-3,Xa+1,o);t*=1-a*.9;let n=Math.abs(o-ct);t-=(1-ro(2.6,4.6,n))*1.7;let i=Math.hypot(o+6,e);return t-=ro(66,92,i)*(.6+Mo(o*.03,e*.03+5)*1.4),t}var Xo;function Rt(o,e,t){let a=document.createElement("canvas");a.width=o,a.height=e;let n=a.getContext("2d");t(n,o,e);let i=new Xo.CanvasTexture(a);return i.colorSpace=Xo.SRGBColorSpace,i.anisotropy=4,i}function Cn(o,e,t){let a=o.attributes.uv;for(let n=0;n<a.count;n++)a.setXY(n,a.getX(n)*e,a.getY(n)*t);return o}function st(o,e,t  La citt\xE0 \xE8 circondata da paludi e canali ed \xE8 la capitale del regno degli [[Ostrogoti]], un [[popolo germanico]]. Il loro grande re, Teodorico, \xE8 morto da quattordici anni. Proprio in questi giorni sono entrati in citt\xE0 i soldati dell\u2019imperatore di Costantinopoli.",firstThought:"Che aria umida! Le case sono fatte di mattoni rossi, sottili sottili. In fondo alla strada c\u2019\xE8 un grande palazzo bianco\u2026 Ma quanti soldati, con gli elmi e gli scudi dipinti!",outro:"Hai conosciuto il [[regno]] degli Ostrogoti, nato nel 493. Per pi\xF9 di trent\u2019anni il re Teodorico garant\xEC la pace e l\u2019Italia stette meglio. Solo alla fine della sua vita govern\xF2 con crudelt\xE0. Dopo la sua morte Giustiniano volle riconquistare l\u2019Italia: la guerra dur\xF2 dal 535 al 553. L\u2019Italia torn\xF2 nell\u2019Impero, ma la popolazione era provata. Il prossimo viaggio ti porta proprio da Giustiniano, a Costantinopoli, nel 550.",menuCam:{r:7,h:5,look:[0,6,-24]},ambience:{wind:.3,birds:.75,insects:.45,crowd:.45,water:.45,fire:.3,chant:.7,mode:"byzantine",horns:.25},relics:[{id:"r-fibula",name:"Fibula a forma d\u2019aquila",short:"Lasciata come offerta davanti alla tomba del re",text:"Una grande [[fibula]] d\u2019oro a forma d\u2019aquila, piena di [[granati|granato]] rossi. Le donne nobili degli [[Ostrogoti]] ne portavano due, una per spalla, per chiudere la veste. \xC8 uno dei gioielli pi\xF9 belli del loro popolo."},{id:"r-moneta",name:"Moneta con il monogramma",short:"Sul tavolo del notaio, nel palazzo",text:"Una piccola moneta d\u2019argento coniata in Italia al tempo di Teodorico. Da una parte c\u2019\xE8 il volto dell\u2019imperatore di Costantinopoli, dall\u2019altra il [[monogramma]] del re. Teodorico governava l\u2019Italia, ma rispettava l\u2019autorit\xE0 dell\u2019imperatore."},{id:"r-tessere",name:"Tessere di mosaico d\u2019oro",short:"Nella basilica di Teodorico",text:"Cubetti di vetro con dentro una foglia d\u2019oro sottilissima. Con migliaia di [[tessere|tessera]] come queste i maestri hanno fatto i [[mosaici|mosaico]] della [[basilica]] di Teodorico. Sul fondo d\u2019oro c\u2019\xE8 perfino il palazzo del re, con la scritta PALATIVM."}],quiz:[{q:"Quando nasce il Regno degli Ostrogoti in Italia, e chi \xE8 il suo re?",a:["Nel 476, con il re Odoacre","Nel 493, con il re Teodorico","Nel 535, con l\u2019imperatore Giustiniano"],ok:1,hint:"Ripensa al vecchio guerriero goto davanti alla tomba del suo re. Quando \xE8 nato il regno?",why:"Esatto! Nel 493 Teodorico diventa padrone dell\u2019Italia e nasce il Regno degli Ostrogoti, con capitale Ravenna."},{q:"Com\u2019\xE8 stato il governo di Teodorico?",a:["Per molti anni garant\xEC la pace; solo alla fine della sua vita govern\xF2 con crudelt\xE0","\xC8 stato crudele dall\u2019inizio alla fine","Ha fatto sempre la guerra ai Romani d\u2019Italia"],ok:0,hint:"Il notaio Aurelio ti ha raccontato due momenti diversi del regno di Teodorico.",why:"Giusto. Prima Teodorico port\xF2 pace e grandi costruzioni. Poi, da vecchio, divenne sospettoso e crudele: fece uccidere il filosofo Boezio."},{q:"Chi volle riconquistare l\u2019Italia dopo la morte di Teodorico?",a:["Il papa di Roma","Il re dei Franchi","Giustiniano, imperatore d\u2019Oriente"],ok:2,hint:"Chi ha mandato in Italia il soldato dell\u2019accampamento?",why:"Esatto: Giustiniano, imperatore di Costantinopoli, mand\xF2 in Italia l\u2019esercito del generale Belisario."},{q:"Come fin\xEC la guerra tra Bizantini e Goti, durata dal 535 al 553?",a:["Vinsero i Goti, e il loro regno dur\xF2 per secoli","L\u2019Italia fu riunita all\u2019Impero bizantino, ma la popolazione era provata","L\u2019Italia fu divisa a met\xE0 tra Goti e Bizantini"],ok:1,hint:"Ripensa a che cosa sapevi tu del futuro mentre parlavi con Lucia, vicino al canale.",why:"Proprio cos\xEC: dopo diciotto anni di guerra l\u2019Italia torn\xF2 nell\u2019Impero, ora bizantino. Ma la gente era provata da fame, assedi e distruzioni."}],build(o){le name:"Eudossio",role:"studente di diritto",goal:"Eudossio, sotto il portico dei giuristi",x:-28.5,z:12,rot:Math.PI/2,anim:"write",radius:3.4,look:{robe:"#e8dcc0",robe2:"#3a4a7a",fabric:"linen",trim:["#3a4a7a","#c9a24a","circle"],book:!0,bookColor:5905940,hairStyle:"curly",hair:1971212,skin:13936258,seed:91},lines:["Shh\u2026 sto ripassando! Domani ho l\u2019esame. Studio il [[diritto]], cio\xE8 le regole che valgono per tutti: chi pu\xF2 sposarsi, come si fa un contratto, come si punisce un ladro\u2026","TU: Che cos\u2019\xE8 quel libro cos\xEC grosso?","\xC8 una parte del [[Corpus Iuris Civilis]], il \xABcorpo del diritto civile\xBB. L\u2019imperatore Giustiniano ha ordinato di raccogliere tutte le leggi romane, dalle pi\xF9 antiche alle pi\xF9 nuove.","Prima era un caos: migliaia di leggi sparse in tanti libri, alcune vecchie di secoli, altre in contrasto tra loro. Neanche i giudici ci capivano pi\xF9 niente!","Una commissione di esperti, guidata dal [[giurista]] [[Triboniano]], le ha lette tutte, ha tolto quelle inutili e ha messo in ordine le altre. Ci hanno messo pochi anni, dal 529 al 534.","La cosa buffa? In citt\xE0 parliamo tutti [[greco]], ma le leggi sono scritte in [[latino]], la lingua di Roma. Cos\xEC io devo studiare in due lingue!","TU: Nel mio tempo, le leggi di tanti Stati europei, anche dell\u2019Italia, vengono in parte proprio da questo libro!","Davvero? Allora devo proprio studiarlo bene! Guarda pure il codice sul tavolo, ma sfoglialo con delicatezza."]}),o.npc({id:"marmista",name:"Leonzio",role:"marmista di Santa Sofia",goal:"Leonzio, sotto la cupola di Santa Sofia",x:6.4,z:Ro+6.4,rot:-.7,look:{dress:"tunic",robe:"#9a8a70",robe2:"#7a6a52",legs:"#5a4a38",belt:"#3a2a1a",beard:!0,hair:5918792,age:.5,skin:12093022,seed:101,height:1.7},lines:["Alza gli occhi, {nome}. Lass\xF9. Non dire niente: guarda e basta.","Questa \xE8 la cupola di [[Santa Sofia]], la \xABSanta Sapienza\xBB. \xC8 larga pi\xF9 di trenta metri e sembra galleggiare nell\u2019aria. Nessuno aveva mai costruito una cupola cos\xEC.","Diciotto anni fa una grande rivolta incendi\xF2 il centro della citt\xE0, e bruci\xF2 anche la vecchia chiesa. [[Giustiniano]] l\u2019ha fatta ricostruire pi\xF9 grande e pi\xF9 bella, insieme a palazzi, portici e cisterne per l\u2019acqua.","Il segreto \xE8 questo: la cupola non poggia su muri, ma su quattro grandi archi. Tra un arco e l\u2019altro ci sono quei triangoli curvi d\u2019oro, i [[pennacchi|pennacchio]]: portano il peso gi\xF9, fino a quattro pilastri enormi.","E guarda la base: una corona di quaranta finestre. La luce passa tra una finestra e l\u2019altra e la cupola sembra appesa al cielo con una catena d\u2019oro.","L\u2019hanno progettata due sapienti, [[Antemio di Tralle]] e [[Isidoro di Mileto]]. Migliaia di operai hanno lavorato giorno e notte: in soli cinque anni la chiesa era finita, nel 537.","Io lucido i marmi: verdi della Tessaglia, rossi d\u2019Egitto, bianchi del Mar di Marmara. Arrivano da tutto l\u2019Impero. E lass\xF9 ci sono milioni di [[tessere|tessera]] d\u2019oro.","Si racconta che il giorno della festa Giustiniano entr\xF2, guard\xF2 in alto e disse: \xABSalomone, ti ho superato!\xBB. Salomone era il re che costru\xEC il grande [[tempio]] di Gerusalemme."]}),o.relic({...this.relics[2],x:5.2,z:Ro+8.4,y:.78,lift:0,spin:.4,model:(()=>{let P=new ve.Group;[X("goldmetal"),n({color:1981066,roughness:.2,metalness:.2}),n({color:2783818,roughness:.2}),X("goldmetal"),n({color:11542058,roughness:.2}),X("goldmetal")].forEach((q,J)=>{let N=new ve.Mesh(new ve.BoxGeometry(.07,.07,.07),q);N.position.set((J%3-1)*.09,Math.floor(J/3)*.08,J%2*.04),N.rotation.y=J*.4,P.add(N)});let O=new ve.Mesh(new ve.BoxGeometry(.13,.13,.13),X("goldmetal"));return O.position.set(0,.17,0),O.rotation.set(.3,.5,0),P.add(O),P.scale.setScalar(1.4),P})()}),Ge({robe:"#efe7d6",robe2:"#d8c070",fabric:"silk",cloak:"#c8a040",cloakType:"mantle",trim:["#efe7d6","#d8b04a","diamond"],beard:"long",hair:9076848,age:.65,book:!0,bookGol a della guerra con l\u2019Impero d\u2019Oriente.",solido:"Moneta d\u2019oro dell\u2019Impero romano d\u2019Oriente. Era cos\xEC affidabile che veniva accettata in tutto il mondo conosciuto.",seta:"Tessuto leggero e lucente, fatto con il filo dei bachi da seta. Veniva dalla Cina ed era carissimo.",mese:"La via principale di Costantinopoli, con portici, colonne e botteghe. In greco il nome vuol dire \xABdi mezzo\xBB.",chalke:"La Porta di Bronzo: l\u2019ingresso principale del Gran Palazzo degli imperatori.",silenziario:"Funzionario di corte che durante le cerimonie faceva rispettare il silenzio davanti all\u2019imperatore.",porpora:"Colore rosso scuro e prezioso, ricavato da un mollusco marino. A Costantinopoli era il colore riservato all\u2019imperatore.",diritto:"L\u2019insieme delle leggi e delle regole che organizzano la vita di uno Stato e dei suoi cittadini.","corpus iuris civilis":"In latino: \xABcorpo del diritto civile\xBB. La grande raccolta delle leggi romane voluta da Giustiniano (529\u2013534).",giurista:"Esperto di leggi e di diritto.",triboniano:"Il giurista che guid\xF2 la commissione incaricata da Giustiniano di raccogliere le leggi romane.",greco:"La lingua parlata nell\u2019Impero d\u2019Oriente. A Costantinopoli la usavano quasi tutti, anche se le leggi erano in latino.",digesto:"Parte del Corpus Iuris Civilis che raccoglie, in ordine, le opinioni dei grandi giuristi romani.","santa sofia":"In greco Haghia Sophia, \xABSanta Sapienza\xBB: la grande chiesa di Costantinopoli, consacrata nel 537. Oggi si trova a Istanbul.",pennacchio:"Triangolo curvo che riempie lo spazio tra due archi e permette di appoggiare una cupola rotonda su una base quadrata.","antemio di tralle":"Matematico e architetto greco: progett\xF2 Santa Sofia insieme a Isidoro di Mileto.","isidoro di mileto":"Matematico e architetto greco: progett\xF2 Santa Sofia insieme ad Antemio di Tralle.",tessera:"Piccolo pezzo di pietra, vetro o oro usato per comporre i mosaici.",milion:"Monumento ad archi di Costantinopoli: da qui si misuravano le distanze di tutte le strade dell\u2019Impero.",bronzo:"Metallo fatto di rame e stagno, usato per statue, porte e monete."}),o.portal(0,5)}};import{mergeGeometries as Dr}from"three/addons/utils/BufferGeometryUtils.js";var Na=o=>28+Math.sin(o*.04)*3,va=8,ma={x:0,z:-33,w:11,d:22},ba={x:20,z:-12},en=-.9;function $c(o,e){let t=(Mo(o*.02+3,e*.02,3)-.5)*1.4;e<va&&(t*=.35);let a=Math.abs(e-Na(o));return t-=(1-ro(4.5,8.5,a))*2.6,t+=ro(60,120,Math.hypot(o,e))*4,t}var rl={id:"longobardi",year:643,yearLabel:"643 d.C.",chapter:1,chapterTitle:"Il nuovo volto dell\u2019Europa",title:"Le leggi del re Rotari",place:"Pavia, capitale del regno longobardo",intro:"Nel [[568]] un altro [[popolo germanico]], i [[Longobardi]], \xE8 entrato in Italia. Sono passati settantacinque anni. La loro capitale \xE8 Pavia, una vecchia citt\xE0 romana sul fiume Ticino. \xC8 una mattina d\u2019autunno piena di nebbia: oggi il re ha una notizia importante.",firstThought:"Che nebbia! Davanti a me c\u2019\xE8 un fiume, con un ponte di legno appoggiato su vecchi piloni di pietra. Dall\u2019altra parte vedo delle mura\u2026 e del fumo che sale dai tetti.",outro:"A Pavia hai conosciuto i Longobardi: padroni duri, in un\u2019Italia divisa con i Bizantini. Grazie a Teodolinda diventano cattolici e con Rotari hanno le loro prime leggi scritte. La sabbia della clessidra ti ha mostrato il futuro: il re Liutprando combatter\xE0 i Bizantini, ma nel 774 il papa chiamer\xE0 i Franchi, che metteranno fine al regno. Ora la clessidra fa un piccolo salto indietro, al 630, e ti porta lontano dall\u2019Europa: nella penisola arabica, alla Mecca.",menuCam:{r:20,h:7,look:[0,3,va]},ambience:{wind:.5,birds:.45,crowd:.35,fire:.35,water:.5,mode:"dorian",horns:.25},relics:[{id:"l-crocetta",name:"Crocetta d\u2019oro",short:"Sul banco del fabbro",text:"Una piccola croce di lamina d\u2019oro, sottile come una foglia. Ha dei forellini sui bordi: i Longobardi la cucivano sul velo o sulla veste dei morti. \xC8 un segno che la fede cristiana sta entrando nella vita di questo popolo. Accanto ci sono [[fibule|fibula]] per chiudere i mantelli."},{id:"l-editto",name:"L\u2019Editto di Rotari",short:"Sul leggio, nella sala del re",text:"Comincia cos\xEC, in [[latino]]: \xABIo, Rotari, nel nome di Dio, re della gente dei Longobardi\u2026\xBB. \xC8 l\u2019[[editto]] del 22 novembre [[643]]: la prima raccolta scritta delle leggi longobarde, 388 capitoli. Al posto della [[faida]], la vendetta, mette il [[guidrigildo]], un prezzo da pagare."},{id:"l-umbone",name:"Umbone di scudo",short:"Nella rastrelliera delle armi, vicino alla porta",text:"Il centro di ferro di uno scudo rotondo di legno: si chiama [[umbone]] e protegge la mano del guerriero. I Longobardi venivano sepolti con le loro armi: spada lunga, lancia e scudo. Portare le armi era il segno dell\u2019uomo libero, l\u2019[[arimanno]]."}],quiz:[{q:"Nel 568 i Longobardi invadono l\u2019Italia. Riescono a conquistarla tutta?",a:["S\xEC, cacciano i Bizantini da tutta l\u2019Italia","No: i Bizantini conservano il potere in alcune regioni, come Ravenna","No: i Longobardi restano solo in Sicilia"],ok:1,hint:"Ripensa a Leone, il mercante al porto sul fiume. Da quale citt\xE0 veniva, e chi comandava l\xEC?",why:"Esatto. I Bizantini tengono Ravenna, Roma e altre regioni: l\u2019Italia \xE8 divisa in due."},{q:"Grazie a chi i Longobardi si convertono al cattolicesimo?",a:["Grazie al re Alboino","Grazie alla regina Teodolinda","Grazie all\u2019imperatore Giustiniano"],ok:1,hint:"Il vecchio prete venuto da Monza ti ha parlato di una regina\u2026",why:"Giusto. Teodolinda, principessa bavara e cattolica, favorisce la conversione dei Longobardi."},{q:"Che cosa fa il re R\xF2tari nel 643?",a:["Fa mettere per iscritto le leggi dei Longobardi","Costruisce la basilica di Monza","Sconfigge i Franchi"],ok:0,hint:"Pensa alla pergamena che il notaio Ansoaldo aveva appena finito di copiare.",why:"Proprio cos\xEC: \xE8 l\u2 a nuova fede nel deserto",place:"La Mecca, nella penisola arabica",intro:"Torniamo un po\u2019 indietro nel tempo e andiamo lontano dall\u2019Europa, nella [[penisola arabica]]. \xC8 l\u2019anno 630. Qui ci sono deserti, montagne di roccia e poche oasi. Nella citt\xE0 della Mecca \xE8 nata da circa vent\u2019anni una nuova religione, che cambier\xE0 la vita di molti popoli.",firstThought:"Che caldo! Sabbia dappertutto e montagne scure all\u2019orizzonte. A sinistra sale il fumo di un accampamento\u2026 e laggi\xF9, in fondo alla valle, vedo delle case.",outro:"Hai conosciuto beduini, contadini delle oasi e mercanti della penisola arabica. Alla Mecca il profeta Maometto ha portato una nuova fede in un solo Dio, l\u2019[[Islam]], con i suoi cinque doveri. La clessidra ti ha mostrato il futuro: dopo il 632 i [[califfi|califfo]] porteranno l\u2019Islam dalla Spagna alla Persia. Il prossimo viaggio ti porta a Baghdad, nell\u2019anno 830.",menuCam:{r:15,h:4,look:[0,4.5,-44]},ambience:{wind:.55,oud:.45,mode:"hijaz",crowd:.35,fire:.35,water:.25,insects:.15},relics:[{id:"a-otre",name:"Otre d\u2019acqua",short:"Appeso vicino al fuoco dei beduini",text:"Una sacca fatta con la pelle intera di una capra, cucita e unta perch\xE9 non perda. I [[beduini|beduino]] la riempiono al pozzo e la legano alla sella del cammello: nel deserto l\u2019acqua \xE8 la cosa pi\xF9 preziosa che ci sia."},{id:"a-incenso",name:"Grani d\u2019incenso",short:"Dal carico del mercante dello Yemen",text:"Gocce di resina dorata, raccolte incidendo la corteccia di un piccolo albero del Sud della penisola. Bruciate, fanno un fumo profumato. L\u2019[[incenso]] e la [[mirra]] erano la ricchezza dell\u2019[[Arabia felice]] e viaggiavano con le [[carovane|carovana]] fino al Mediterraneo."},{id:"a-moneta",name:"Moneta d\u2019argento",short:"Sul banco del vecchio mercante",text:"Un [[dirham]] d\u2019argento dei re di Persia. Gli Arabi non hanno ancora monete proprie: i mercanti della Mecca usano l\u2019argento persiano e l\u2019oro bizantino. Con le loro carovane fanno della Mecca un grande centro di [[commercio]]."}],quiz:[{q:"Perch\xE9 La Mecca era una citt\xE0 importante gi\xE0 prima dell\u2019Islam?",a:["Era un centro di commercio e un luogo sacro, dove si venerava la Pietra Nera","Era la capitale di un grande impero con un esercito potente","Era circondata da fiumi e da campi di grano"],ok:0,hint:"Ripensa al vecchio mercante e alle sue carovane\u2026 e a che cosa c\u2019\xE8 al centro del cortile.",why:"Esatto. La Mecca era un centro di commercio sulle vie delle carovane e un luogo sacro: alla Kaaba si venerava la Pietra Nera."},{q:"Che cos\u2019\xE8 l\u2019\xE8gira del 622?",a:["Il pellegrinaggio alla Mecca","La fuga del profeta Maometto e dei suoi compagni dalla Mecca a Medina","Il mese del digiuno"],ok:1,hint:"La parola araba hijra vuol dire \xABmigrazione\xBB. Chi doveva andarsene, e perch\xE9?",why:"Esatto. I potenti della Mecca osteggiavano il profeta Maometto, che nel 622 fugg\xEC a Medina. Nel 630 rientr\xF2 vittorioso alla Mecca e gli Arabi abbandonarono gli idoli."},{q:"Quali sono i cinque doveri fondamentali dei musulmani?",a:["Preghiera, commercio, caccia, digiuno, guerra","Viaggiare, allevare cammelli, montare le tende, scrivere poesie, fare il mercato","Professione di fede, preghiera, digiuno nel Ramad\xE0n, elemosina, pellegrinaggio alla Mecca"],ok:2,hint:"Ripensa all\u2019im\xE0m Yusuf e alla ragazza che portava il cibo al povero.",why:"Proprio cos\xEC. L\u2019Islam crede in un solo Dio, il suo testo sacro \xE8 il Corano e non ci sono sacerdoti: l\u2019im\xE0m guida la preghiera."},{q:"Secondo la visione della clessidra, che cosa succeder\xE0 dopo la morte del profeta Maometto, nel 632?",a:["Gli Arabi torneranno a vivere solo nel deserto","I califfi conquisteranno Siria, Palestina, Egitto, Nord Africa, Spagna e Sicilia","La Mecca verr\xE0 abbandonata da tutti"],ok:1,hint:"Nella sabbia della clessidra, le frecce partivano dall\u2019Arabia e andavano lontan "Benvenuto alla Mecca, ragazzo. Io sono Jabir, mercante della trib\xF9 dei [[Quraysh]]. Per quarant\u2019anni ho guidato carovane: d\u2019inverno verso lo Yemen, d\u2019estate verso la Siria.","Guardati intorno: la Mecca sta in una valle arida, tra montagne di roccia. Qui non cresce quasi niente. Eppure \xE8 sempre stata una citt\xE0 importante: un centro di [[commercio]] e un luogo sacro.","Al centro della citt\xE0 c\u2019\xE8 la [[Kaaba]], un antico santuario a forma di cubo. In un suo angolo \xE8 murata la [[Pietra Nera]], venerata da tempi antichissimi. Ogni anno arrivavano pellegrini da tutta l\u2019Arabia, e con loro fiere e mercanti.","Allora gli Arabi erano [[politeisti|politeista]]: adoravano molti dei. Intorno alla Kaaba c\u2019erano tantissimi [[idoli|idolo]], statue di pietra e di legno, quasi uno per ogni trib\xF9.","Poi un uomo della Mecca, il profeta Maometto, la pace sia su di lui, predic\xF2 che esiste un solo Dio. I ricchi mercanti come me temevano di perdere affari e potere. Derisero e perseguitarono lui e chi lo seguiva.","Nel 622 il profeta e i suoi compagni lasciarono la Mecca e andarono a Yathrib, un\u2019oasi a nord. Questa fuga si chiama [[\xE8gira]], cio\xE8 \xABmigrazione\xBB. Da allora quella citt\xE0 si chiama [[Medina]], \xABla citt\xE0 del Profeta\xBB.","TU: (Io so che cosa succeder\xE0: fra qualche anno i musulmani cominceranno a contare gli anni proprio dal 622. Sar\xE0 l\u2019anno 1 del loro calendario.)","E quest\u2019anno, il [[630]], il profeta \xE8 tornato con migliaia di seguaci. La Mecca si \xE8 arresa quasi senza combattere e lui ha perdonato quasi tutti. Gli idoli intorno alla Kaaba sono stati tolti.","Ora gli Arabi stanno lasciando gli idoli per l\u2019[[Islam]]. Anch\u2019io, vecchio come sono, sono diventato musulmano. Prendi quella moneta d\u2019argento sul banco, e va\u2019 nel cortile: l\u2019im\xE0m ti spiegher\xE0 la nuova fede."]}),o.zone({x:6,z:2,r:6,text:"Case basse e quadrate, fatte di mattoni di fango, con i tet in:12884596,seed:33},lines:["Shh\u2026 parla piano, qui si studia. Benvenuto nella [[Casa della Sapienza]]. La cominci\xF2 il califfo Harun; suo figlio, il califfo al-Ma\u2019mun, l\u2019ha resa grandissima.","Io mi chiamo Ishaq e sono cristiano. Parlo greco, siriaco e arabo. Il mio lavoro \xE8 [[tradurre]]: prendo un libro scritto in greco e lo riscrivo in arabo.","TU: Che libri traducete?","I libri dei grandi sapienti dell\u2019antichit\xE0: il [[filosofo]] Aristotele, il matematico Euclide, l\u2019astronomo Tolomeo, i medici Ippocrate e Galeno. Il califfo manda a cercarli perfino a Costantinopoli.","In Occidente quasi nessuno li legge pi\xF9: pochi conoscono ancora il greco. Se non li conservassimo e non li traducessimo, andrebbero perduti per sempre. Un giorno, dall\u2019arabo, questi libri torneranno in Occidente, tradotti in [[latino]].","Qui lavoriamo insieme: musulmani, cristiani, ebrei, persiani. Quel signore con il libro rosso si chiama Yaqub ed \xE8 ebreo. Conta quello che sai, non da dove vieni.","E abbiamo la [[carta]]! A Baghdad c\u2019\xE8 una [[cartiera]]: la carta costa molto meno della [[pergamena]], cos\xEC i libri si moltiplicano. Ora va\u2019 sulla terrazza qui a fianco: c\u2019\xE8 un matematico che ti piacer\xE0."]});for(let[f,w,C]of[[E-6,U+2.75,{robe:"#e8e0cc",robe2:"#3a5a4a",hat:"turban",hatColor:"#f2ecdc",beard:"long",hair:10130570,age:.8,skin:12094052,seed:91}],[E+6,U+2.75,{robe:"#3a3028",robe2:"#5a4a3a",hat:"cap",hatColor:"#2a2018",beard:"full",hair:2759698,skin:13148282,seed:92}]]){let V=Fe({...C,anim:"write"});V.userData.anim="write",V.position.set(f,.1,w),V.rotation.y=Math.PI,t.add(V),o.collideCircle(f,w,.4),o.onUpdate((ee,ge)=>jo(V,ge,null,ee))}zo(o,Fe({robe:"#2a3450",robe2:"#e8e0cc",hat:"cap",hatColor:"#141414",beard:"long",hair:6969930,age:.6,skin:13148282,seed:131,book:!0,bookColor:10493976,bookGold:!0}),E+4.3,U-3.9,Math.PI*.85,"idle",{look:!0});{let f=new se.Mesh(Zt(ce-.6,k-.6,1.1),So({map:ad(),roughness:.55}));f.rotation.x=-Math. n:11567200,spear:!0,sword:!0,belt:"#5a3a1a",seed:61},lines:["Pace a te, viaggiatore! Benvenuto a Baghdad, la [[Citt\xE0 della pace]]. Vieni da lontano, vero? Hai gli occhi di chi vede tutto per la prima volta.","TU: \xC8 enorme! Chi ha costruito queste mura?","Il [[califfo]] al-Mansur, nel 762. Ha voluto una citt\xE0 perfettamente rotonda, con mura di mattoni e quattro porte. Al centro ci sono il suo palazzo con la cupola verde e la grande moschea. Mio nonno portava i mattoni!","Ma la nostra storia comincia prima. Nel [[632]] mor\xEC il Profeta Maometto, la pace sia su di lui. Da allora i musulmani sono guidati dal califfo: la parola vuol dire \xABsuccessore\xBB.","I califfi hanno conquistato quasi tutta l\u2019Arabia e grandi terre dell\u2019[[impero persiano]] e dell\u2019[[impero bizantino]]: la Siria, la Palestina, l\u2019Egitto, il Nord Africa. Da pi\xF9 di cent\u2019anni anche la Spagna.","E tre anni fa, nell\u2019827, le navi musulmane sono sbarcate in Sicilia, un\u2019isola vicina alla tua Italia.","Prima governavano i califfi della famiglia degli [[Omayyadi]], da Damasco, in Siria. Nel 750 il potere \xE8 passato alla famiglia degli [[Abbasidi]], che hanno fatto di Baghdad la capitale. Il loro colore \xE8 il nero: guarda il mio turbante!","TU: E le persone di altre religioni? Le hanno cacciate?","No. Ebrei e Cristiani pregano nelle loro sinagoghe e nelle loro chiese. Pagano una tassa speciale e il califfo li protegge. Si chiama [[tolleranza]]. Anche i medici del califfo sono cristiani!","Oggi regna il califfo al-Ma\u2019mun. Suo padre, Harun al-Rashid, scambi\xF2 ambasciatori con un re lontano, Carlo, re dei [[Franchi]], e gli mand\xF2 in dono perfino un elefante! Entra pure: il [[suq]] \xE8 subito dietro la porta."]}),o.glossary({"citt\xE0 della pace":"In arabo \xABMadinat al-Salam\xBB: il nome che il califfo al-Mansur diede a Baghdad quando la fond\xF2, nel 762.",califfo:"Dall\u2019arabo \xABkhalifa\xBB, cio\xE8 \xABsuccessore\xBB: chi guida la comunit\xE0 dei musulmani dopo la morte del profeta Maometto.",632:"L\u2019anno della morte del profeta Maometto, a Medina. Dopo di lui i musulmani sono guidati dai califfi.","impero persiano":"Il grande regno dei Persiani, nell\u2019attuale Iran e Iraq. Fu conquistato dagli Arabi a met\xE0 del 600.","impero bizantino":"L\u2019Impero romano d\u2019Oriente, con capitale Costantinopoli. Gli Arabi gli tolsero la Siria, la Palestina, l\u2019Egitto e il Nord Africa.",omayyadi:"Famiglia di califfi che govern\xF2 il mondo islamico dal 661 al 750, con capitale Damasco, in Siria.",abbasidi:"Famiglia di califfi che prese il potere nel 750 e fece di Baghdad la sua capitale. Il loro colore era il nero.",tolleranza:"Rispettare chi ha idee o religioni diverse dalle proprie e lasciarlo vivere secondo le sue usanze.",franchi:"Popolo germanico che viveva nell\u2019attuale Francia. Il loro re pi\xF9 famoso fu Carlo Magno.",suq:"Il mercato delle citt\xE0 arabe: vie strette e coperte, piene di botteghe e banchi.",carovana:"Gruppo di mercanti che viaggiano insieme, con i cammelli carichi di merci, per attraversare deserti e terre pericolose.",carta:"Materiale per scrivere fatto con fibre vegetali e stracci, pressati e asciugati. Inventata in Cina, arriv\xF2 in Europa grazie agli Arabi.",cartiera:"Laboratorio dove si fabbrica la carta.","casa della sapienza":"In arabo \xABBayt al-Hikma\xBB: la grande biblioteca di Baghdad dove studiosi di religioni diverse traducevano in arabo i libri greci, persiani e indiani.",tradurre:"Riscrivere un testo in un\u2019altra lingua, conservandone il significato.",filosofo:"Studioso che cerca di capire con la ragione le grandi domande: che cos\u2019\xE8 il mondo, che cosa \xE8 giusto, come si conosce la verit\xE0.",astrolabio:"Strumento di metallo a forma di disco per misurare l\u2019altezza del sole e delle stelle, sapere l\u2019ora e orientarsi.",ottone:"Metallo giallo e lucente, fatto mescolando rame e zinco.",zero:"Il numero che indica \xABniente\xBB. \xC8 nato :.4,skin:14198920,tool:"basket"}),32);o.npc({id:"ilda",name:"Oda",role:"nobile franca, cura i feriti",goal:"Oda, sotto la tettoia dei feriti",model:B,x:Ba.x-.4,z:Ba.z-1.9,rot:-2.4,anim:"idle",lines:["Piano, non svegliarli: hanno combattuto tutto il giorno. Io sono Oda. Mio marito \xE8 un nobile al seguito di Carlo, e io curo i feriti con erbe, acqua calda e bende di lino.","TU: Chi \xE8 questo Carlo? \xC8 il re dei Franchi?","No, non \xE8 il re. Ascolta. Pi\xF9 di duecento anni fa il grande re Clodoveo riun\xEC tutti i Franchi. Ma quando mor\xEC, nel 511, il regno fu diviso tra i suoi quattro figli.","Da allora i Franchi hanno avuto spesso pi\xF9 regni e pi\xF9 re, che litigavano tra loro. Accanto a ogni re c\u2019\xE8 un [[maestro di palazzo]], chiamato anche [[maggiordomo]].","All\u2019inizio il maestro di palazzo era solo il capo dei servitori del re. Poi, poco a poco, ha preso in mano tutto: le terre, i tesori, l\u2019esercito. Oggi i re contano pochissimo.","TU: Nei miei libri questi re li chiamano \xABre fannulloni\xBB!","Fannulloni? Ah ah, non dirlo forte! Il re di oggi si chiama Teodorico IV. Ma chi comanda davvero \xE8 Carlo, il maestro di palazzo. Lo trovi davanti alla tenda rossa."]})}{let B=l(K({robe:"#6a4a2a",legs:"#9a8a68",mail:!0,hat:"helmet",shield:"#8a2a22",spear:!0,sword:!0,cloak:"#4a3a2a",beard:"full",hair:9077368,age:.7,seed:721,height:1.8}),32);o.npc({id:"folco",name:"Folco",role:"vecchio guerriero franco",goal:"Folco, tra le armi raccolte",model:B,x:on.x-.6,z:on.z+1.4,rot:-Math.PI/2-.3,anim:"idle",lines:["Ehi, ragazzo, attento a dove metti i piedi: queste lance sono affilate. Io sono Folco. Combatto per i Franchi da quarant\u2019anni.","Noi Franchi viviamo in queste terre: dal fiume Reno fino ai monti Pirenei, dall\u2019oceano fino alle Alpi.","TU: \xC8 pi\xF9 o meno il territorio della Francia di oggi! Anzi, il nome \xABFrancia\xBB viene proprio dai Franchi.","Ieri c\u2019\xE8 stata la battaglia. Siamo rimasti in piedi tutto il giorno, uno accanto all\u2019altro, scudo contro scudo, come un muro. I cavalieri arabi ci hanno caricato tante volte, ma il muro ha tenuto.","Stamattina, all\u2019alba, ci siamo preparati a combattere ancora. Ma le loro tende erano vuote: se n\u2019erano andati di notte, in silenzio.","Adesso raccogliamo le armi sparse sul campo e curiamo i feriti. Se vuoi sapere perch\xE9 siamo qui, chiedi al nostro capo, Carlo."]})}{let B=Ht.x-5,H=Ht.z+3,W=l(Fe({robe:"#2e2620",robe2:"#26201a",hat:"tonsure",hair:6965802,skin:14199430,age:.3,seed:731,beard:!1,anim:"write"}),32);o.npc({id:"ilduino",name:"Ilduino",role:"monaco e cronista",goal:"Ilduino, vicino alla croce",model:W,x:B,z:H,rot:Math.PI/2,anim:"write",lines:["Pace a te. Sono fratello Ilduino, monaco. Seguo l\u2019esercito per pregare con i soldati e per scrivere la [[cronaca]] di quello che succede.","Sai perch\xE9 i Franchi pregano davanti a questa croce? Pi\xF9 di duecento anni fa i Franchi adoravano ancora gli antichi dei.","Poi venne il re [[Clodoveo]]. Un\xEC le trib\xF9 dei Franchi e conquist\xF2 quasi tutta la [[Gallia]]. Sua moglie, la regina Clotilde, era cristiana.","Clodoveo si fece [[battezzare|battesimo]] nella citt\xE0 di Reims dal [[vescovo]] Remigio. Si racconta che con lui ricevettero il battesimo migliaia di guerrieri.","Da allora i Franchi sono cristiani, e seguono la stessa fede del [[papa]] di Roma. Per questo i vescovi e la Chiesa sono sempre stati vicini ai re franchi.","Ora scrivo che cosa \xE8 successo ieri, presso Poitiers: cos\xEC, fra cento anni, chi legger\xE0 sapr\xE0 la verit\xE0."]})}{let B=l(K({robe:"#7a2a22",legs:"#7a6a4a",mail:!0,cloak:"#2a3a5a",cloakType:"cloak",sword:!0,beltGold:!0,belt:"#2a1a10",jewel:!0,trim:["#7a2a22","#d8b860","diamond"],hairStyle:"short",hair:5913122,beard:"full",age:.45,seed:741,height:1.86,skin:14196864}),42);o.npc({id:"carlo",name:"Carlo Martello",role:"maestro di palazzo dei Franchi",goal:"Carlo, davanti alla tenda rossa",model:B,x:Aa.x,z:Aa.z+4.6,rot:-.15,anim:"idle",lines:["Chi sei? Un ragazzo, in mezzo ai miei guerrieri? Avvicinati pure. Io sono Carlo, figlio di Pipino. Come mio padre, sono [[maestro di palazzo]].","Il re dei Franchi ha il titolo di re e porta i capelli lunghi, come tutti i re della sua famiglia. Ma sono io a guidare i regni dei Franchi: sono quattro, e il mio compito \xE8 tenerli uniti.","Quest\u2019estate gli Arabi sono arrivati dalla Spagna. Hanno sconfitto il duca d\u2019[[Aquitania]], Eudo, e lui \xE8 venuto a chiedermi aiuto. Cos\xEC ho radunato l\u2019esercito.","Ieri ci siamo scontrati, qui presso Poitiers. I miei uomini sono rimasti fermi come un muro. Il comandante nemico, Abd al-Rahman, \xE8 caduto in battaglia.","Stanotte il loro esercito se n\u2019\xE8 andato. Ricordati questo anno, ragazzo: il [[732]]. Gli Arabi non sono riusciti ad andare oltre Poitiers.","TU: Nei libri di storia ti chiamano \xABCarlo Martello\xBB, perch\xE9 hai colpito i nemici forte come un martello!","Martello? Mi piace. Ora va\u2019: un uomo che governa non ha mai tempo per riposare."]}),o.glossary({732:"L\u2019anno in cui Carlo Martello, maestro di palazzo dei Franchi, sconfigge gli Arabi a Poitiers."}),l(zo(o,K({robe:"#4a3a2a",legs:"#a89878",mail:!0,hat:"helmet",shield:tr[1][0],spear:!0,cloak:"#5a2a1a",beard:"full",hair:3811866,seed:751,age:.35,height:1.84}),Aa.x+3.2,Aa.z+5.4,-.4,"idle",{look:!0}))}{let B=ii.x,H=ii.z,W=s(B,H),ne=new e.Mesh(new e.CylinderGeometry(.42,.55,.9,12),X("wood",{tone:"#5a4434"}));ne.position.set(B,W+.42,H),ne.castShadow=!0,a.add(ne),o.collideCircle(B,H,.55);let de=new e.Mesh(new e.CircleGeometry(.4,16),X("wood",{tone:"#a88a64"}));de.rotation.x=-Math.PI/2,de.position.set(B,W+.875,H),a.add(de);let pe=new e.Group,Se=new e.MeshStandardMaterial({color:13624575,transparent:!0,opacity:.28,roughness:.05,metalness:.1,emissive:3824266,emissiveIntensity:.4,depthWrite:!1,side:e.DoubleSide}),qe=X("goldmetal");for(let P of[-1,1]){let A=new e.Mesh(new e.CylinderGeometry(P>0?.2:.03,P>0?.03:.2,.32,20,1,!0),Se);A.positio lla citt\xE0 e della Chiesa."},{id:"r8-avari",name:"Ornamento d\u2019oro degli Avari",short:"Tra i doni, vicino all\u2019altare",text:"La punta d\u2019oro di una cintura, con un [[grifone]] inciso. Viene dal \xABRing\xBB, il grande accampamento fortificato degli [[Avari]], conquistato dai Franchi nel 796. L\xEC c\u2019erano tesori enormi: Carlo ne ha mandato una parte in dono al papa, qui a Roma."}],quiz:[{q:"Chi \xE8 Carlo Magno?",a:["Un imperatore di Costantinopoli","Il figlio di Pipino, re dei Franchi e grande condottiero","Il re dei Longobardi che vive a Pavia"],ok:1,hint:"Ripensa al guerriero franco nell\u2019atrio: di chi era figlio il suo re?",why:"Esatto! Carlo \xE8 figlio di re Pipino ed \xE8 un grande condottiero: vince quasi tutte le sue guerre."},{q:"Quali popoli sconfigge Carlo Magno, imponendo loro il Cristianesimo?",a:["Longobardi, Sassoni, Bavari e Avari","Arabi, Persiani e Vandali","Greci, Egiziani e Romani"],ok:0,hint:"Il guerriero Teudo li ha nominati uno per uno. E il ragazzo sotto il portico era uno di loro.",why:"Giusto. Carlo vince Longobardi, Sassoni, Bavari e Avari e obbliga i popoli vinti a diventare cristiani."},{q:"Che cosa succede nel 774 e nell\u2019800?",a:["Nel 774 Carlo diventa imperatore; nell\u2019800 conquista Pavia","Nel 774 nasce Carlo; nell\u2019800 muore Pipino","Nel 774 Carlo diventa re dei Franchi e dei Longobardi; nell\u2019800 il papa lo incorona imperatore"],ok:2,hint:"Teudo ti ha raccontato dell\u2019assedio di Pavia. E che cosa hai visto davanti all\u2019altare, il giorno di Natale?",why:"Esatto! Nel 774 Carlo vince i Longobardi e diventa anche loro re; il giorno di Natale dell\u2019800 papa Leone III lo incorona imperatore."},{q:"Com\u2019\xE8 l\u2019Impero carolingio?",a:["Cristiano, ispirato all\u2019Impero romano, con capitale Aquisgrana","Pagano, pi\xF9 grande dell\u2019Impero romano, con capitale Roma","Diviso tra molte religioni, con capitale Costantinopoli"],ok:0,hint:"Ricordi che cosa ti ha detto Carlo dopo l\u . Parli con me? Pochi qui lo fanno. Mi chiamo Egberto e sono [[sassone|sassoni]]. Vengo da lontano, dalle foreste del nord, oltre il fiume Reno.","Il mio popolo pregava gli antichi dei. Avevamo un grande tronco sacro, l\u2019[[Irminsul]]. I Franchi l\u2019hanno abbattuto quando io non ero ancora nato.","Per tanti anni i Sassoni hanno combattuto per restare liberi. Ma i Franchi erano pi\xF9 forti. Chi veniva vinto doveva ricevere il [[battesimo]] e diventare cristiano, oppure era punito.","Io sono stato battezzato da bambino. Poi mi hanno portato alla corte di Carlo come [[ostaggio]]: se la mia famiglia si ribella, sono io a pagare. Cos\xEC ho imparato il latino e le preghiere.","TU: E adesso che cosa pensi?","Non lo so. Prego il Dio dei cristiani, e questa chiesa \xE8 bellissima. Ma a volte sogno la mia lingua, le mie foreste, i canti di mia madre. Ricordati di noi, viaggiatore: anche i vinti hanno una storia."]}),o.npc({id:"eugenio",name:"Eugenio",role:"diacono del papa Leone III",goal:"Eugenio, il diacono nella navata",x:-3.4,z:-19,rot:.4,look:{robe:"#f0eadc",robe2:"#e8e0cc",fabric:"linen",trim:["#f0eadc","#8a1e2a","circle"],hat:"tonsure",hair:3810840,age:.3,skin:13936258,seed:831,book:!0,bookGold:!0},lines:["Pace a te. Io sono Eugenio, [[diacono]] del papa [[Leone III]]. Fra poco comincia la messa di Natale: guarda, abbiamo acceso tutte le lampade della basilica!","Le colonne vengono da antichi edifici romani: per questo sono tutte diverse. E l\xE0 in fondo, sotto l\u2019altare, c\u2019\xE8 la tomba dell\u2019apostolo Pietro, il primo papa.","L\u2019anno scorso il papa \xE8 stato aggredito per le strade di Roma da alcuni nemici. \xC8 fuggito oltre le Alpi, da Carlo, a chiedere aiuto. Carlo lo ha protetto e lo ha fatto tornare a Roma.","Il papa e i Franchi sono alleati da tanto tempo. Gi\xE0 re Pipino, il padre di Carlo, aveva difeso Roma dai Longobardi. Oggi il papa vuole ringraziare Carlo in un modo speciale.","Il re \xE8 laggi\xF9, davanti alla [[confessione]], la tomba di Pietro. Vai pure, ma con rispetto: \xE8 l\u2019uomo pi\xF9 potente dell\u2019Occidente."]});let Be=Fe({...Ve,robe:"#2a4a7a",robe2:"#24406a",fabric:"silk",trim:["#2a4a7a","#d8b04a","diamond"],legs:"#7a2a24",shoes:4860442,beltGold:!0,belt:"#3a2414",cloak:"#8a1e2a",cloakType:"chlamys",sword:!0,hair:14209734,hairStyle:"short",age:.62,skin:14199430,seed:841,height:1.9});{let S=Be.userData.parts,T=n({color:14209734,roughness:.7});for(let y of[-1,1]){let M=new xe.Mesh(new xe.CapsuleGeometry(.009,.036,4,8),T);M.position.set(y*.022,-.036,.103),M.rotation.z=y*(Math.PI/2-.5),M.rotation.y=-y*.35,S.head.add(M);let p=new xe.Mesh(new xe.CapsuleGeometry(.006,.02,4,6),T);p.position.set(y*.044,-.051,.092),p.rotation.z=y*.35,S.head.add(p)}}let De=new xe.Group;{let S=Be.userData.parts,T=.108,y=1.17,M=new xe.Mesh(new xe.CylinderGeometry(T*1.1,T*1.08,.06,32,1,!0),l(s.gold,xe.DoubleSide));De.add(M);for(let G=0;G<8;G++){let E=G/8*Math.PI*2,U=new xe.Mesh(new xe.BoxGeometry(.03,.075,.006),s.gold);U.position.set(Math.sin(E)*T*1.12,.02,Math.cos(E)*T*1.12),U.rotation.y=E,De.add(U);let ce=new xe.Mesh(new xe.SphereGeometry(.009,8,6),n({color:[11542058,1989258,2783802,15789280][G%4],roughness:.1,metalness:.2}));ce.position.set(Math.sin(E)*T*1.15,.02,Math.cos(E)*T*1.15),De.add(ce)}let p=new xe.Mesh(new xe.TorusGeometry(T*1.08,.007,6,24,Math.PI),s.gold);p.position.y=.03,p.rotation.y=Math.PI/2,De.add(p);let g=new xe.Mesh(new xe.BoxGeometry(.008,.04,.008),s.gold);g.position.y=T*1.08+.05,De.add(g);let v=new xe.Mesh(new xe.BoxGeometry(.03,.008,.008),s.gold);v.position.y=T*1.08+.055,De.add(v),De.position.y=T*y*.62+.01,De.visible=!1,S.head.add(De)}let P=o.npc({id:"carlo",name:"Carlo",role:"re dei Franchi e dei Longobardi",goal:"Carlo, davanti alla tomba di Pietro",model:Be,x:0,z:-48.1,rot:Math.PI-.55,anim:"idle",lines:["TU: (sottovoce) Re Carlo?","S\xEC, sono Carlo, re dei Franchi e dei Longobardi. Parla piano, ragazzo: sto pregando sulla tomba dell\u2019apostolo. Ogni volta che vengo a Roma,  Governo una [[marca]], una zona di confine all\u2019estremo ovest dell\u2019Impero. Oltre il confine vivono i Bretoni, che spesso non accettano il potere del re.","Un conte governa un comitato tranquillo. Io invece devo difendere il confine: per questo ho pi\xF9 soldati e pi\xF9 poteri di un conte.","Tanti anni fa questa marca era guidata da Rolando, un guerriero famoso. Mor\xEC nel 778, in una battaglia sui Pirenei, a Roncisvalle.","Ci sono marche anche a est, verso gli Avari, e a sud, verso gli Arabi di Spagna. Le marche sono come uno scudo intorno all\u2019Impero."]}),s(zo(o,O(913,{robe:"#5a4a3a",shield:"#c8a030",cloak:"#6a1e1e",beard:!0}),-1.2,-19.2,2.5,"idle",{look:!0})),J(q(3811870,{saddle:6954526}),-1.6,-13.6,Math.PI*.1),J(q(8018490,{saddle:2767450,bags:!0}),-23.5,yo-3.4,Math.PI/2-.2),J(q(4862496,{saddle:5909050,bags:!0}),-24.5,yo+5.2,Math.PI/2+.3),t.box(.9,.55,.6,u.wood,-21.2,.28,yo+5.8),t.box(.92,.06,.62,u.bronze,-21.2,.58,yo+5.8,{solid:!1}),o.relic({...this.relics[0],x:-21.2,z:yo+5.8,y:.82,lift:0,model:(()=>{let y=new e.Group,M=new e.Mesh(new e.CylinderGeometry(.055,.055,.36,14),X("parchment"));M.rotation.z=Math.PI/2,y.add(M);let p=new e.Mesh(new e.TorusGeometry(.058,.006,4,16),We(8003106,.7));p.rotation.y=Math.PI/2,y.add(p);let g=new e.Mesh(new e.CylinderGeometry(.045,.045,.015,16),We(11020834,.4));return g.position.set(0,-.08,.02),g.rotation.x=.3,y.add(g),y.scale.setScalar(1.3),y})()}),o.npc({id:"erchemberto",name:"Erchemberto",role:"conte, missus dominicus",goal:"il conte Erchemberto, davanti alla cappella",x:-21.6,z:yo+2.6,rot:Math.PI/2+.4,required:!1,model:s(Fe({dress:"tunic",robe:"#2a4a5a",legs:"#5a4a38",cloak:"#7a5a2a",sword:!0,belt:"#3a2416",beltGold:!0,beard:!0,hair:2759184,age:.4,seed:871,height:1.8})),lines:["Sono il conte Erchemberto. Appena il vescovo Rainaldo avr\xE0 finito di pregare, partiremo: siamo una coppia di [[missi dominici]].","Uno di noi \xE8 un uomo di Chiesa, l\u2019altro un nobile. Cos\xEC controlliamo tutto: le chiese e i mona 6),lines:["Silenzio, per favore\u2026 Ah, sei nuovo? Sono Amalrico, [[notaio]] del palazzo. Sto leggendo le nuove leggi a questi signori.","Le leggi dell\u2019Impero si chiamano [[capitolari|capitolare]], perch\xE9 sono divise in tanti piccoli capitoli. Ogni capitolo dice una cosa precisa.","Ascolta questo: \xABI conti e i giudici giudichino con giustizia, e proteggano le chiese, le vedove e gli orfani\xBB.","E quest\u2019altro: \xABOgni uomo libero giuri fedelt\xE0 all\u2019imperatore\xBB. Il re lo ha ordinato proprio quest\u2019anno.","Il re decide le leggi con i grandi del regno. Noi notai le scriviamo in [[latino]] e ne facciamo molte copie. I missi dominici le portano in tutto l\u2019Impero.","Ogni popolo dell\u2019Impero conserva le sue leggi antiche. Ma i capitolari valgono per tutti, dalla Sassonia fino all\u2019Italia.","Guarda anche la tavola dipinta sulla parete: il maestro della scuola del palazzo la usa per spiegare ai giovani nobili come \xE8 organizzato l\u2019Impero."]}),t.box(3.6,.1,.45,u.wood,1.2+.4,.45,M+2.6,{solid:!1});for(let me of[-1,1])t.box(.1,.45,.4,u.woodD,1.2+.4+me*1.6,.22,M+2.6,{solid:!1});o.collideBox(1.2+.4,M+2.6,3.6,.5),s(zo(o,Fe({dress:"tunic",robe:"#6a3a2a",legs:"#4a3a30",cloak:"#2a3a4a",beard:"full",hair:4864554,age:.5,seed:925,belt:"#3a2416"}),1.2-.5,M+2.6,Math.PI,"sit",{y:0,solid:!1}),24),s(zo(o,Fe({dress:"tunic",robe:"#3a5a4a",legs:"#5a4a38",cloak:"#6a4a2a",beard:!0,hair:10127984,age:.7,seed:927,belt:"#3a2416"}),1.2+1.4,M+2.6,Math.PI,"sit",{y:0,solid:!1}),24);let G=1.2+4.2,E=M-.4;t.box(2.2,.08,.9,u.wood,G,.82,E,{solid:!1}),o.collideBox(G,E,2.2,.9);for(let[me,be]of[[-1,-.38],[1,-.38],[-1,.38],[1,.38]])t.box(.07,.8,.07,u.woodD,G+me,.41,E+be,{solid:!1});for(let me=0;me<3;me++){let be=new e.Mesh(new e.PlaneGeometry(.36,.5),X("parchment"));be.rotation.set(-Math.PI/2,0,me*.3-.3),be.position.set(G-.6+me*.4,.87,E+.05),a.add(be)}ea(o,G-.9,.86,E-.3,{light:!1}),t.box(.12,.1,.12,We(2759184),G+.1,.91,E-.3,{solid:!1}),s(zo(o,Fe({robe:"#3a3430" che governa una marca, cio\xE8 una zona di confine dell\u2019Impero, e ha il compito di difenderla.",marca:"Zona di confine dell\u2019Impero carolingio, governata da un marchese. Ne sono un ricordo nomi come le Marche, in Italia.","missi dominici":"In latino \xABinviati del signore\xBB. Erano uomini di fiducia di Carlo Magno, sempre in coppia (un ecclesiastico e un laico), che controllavano conti e marchesi.",capitolare:"Raccolta di leggi dell\u2019Impero carolingio, divisa in tanti capitoli. Le copie venivano portate in tutto l\u2019Impero.",notaio:"Chi scrive e conserva i documenti ufficiali, come le leggi e gli ordini del re.",sigillo:"Impronta lasciata nella cera da un anello o da un timbro: dimostra chi ha scritto un documento.",sperone:"Punta di metallo legata al tallone del cavaliere, che serve a spronare il cavallo.","cotta di maglia":"Armatura fatta di migliaia di piccoli anelli di ferro intrecciati. Costava moltissimo.",laico:"Chi non \xE8 un sacerdote, un monaco o un vescovo."}),o.portal(10,-14),Pd(a,i,r)}};import{mergeGeometries as cs}from"three/addons/utils/BufferGeometryUtils.js";var Zn={x0:11,x1:21,z0:2,z1:15},Bi={x0:11,x1:21,z0:-7,z1:2},lr={x0:-21,x1:-11,z0:3,z1:15},Ya={x0:-22,x1:22,z0:-21.5,z1:-7.5};function Hd(o,e){let t=Math.hypot(o,e-2),a=(Mo(o*.03+5,e*.03,3)-.5)*1.4*ro(38,60,t);return a-=3.2*ro(-30,-45,e)+3*ro(-44,-54,e),a+=ro(-100,-118,e)*(4+Mo(o*.02,e*.02+3,3)*10),a+=ro(62,120,Math.hypot(o,e-10))*(e>-60?1:0)*(6+Mo(o*.015+9,e*.015,4)*22),a}var Pl={id:"tours",year:803,yearLabel:"803 d.C.",chapter:2,chapterTitle:"Carlo Magno crea un nuovo impero",title:"Carlo Magno e la cultura",place:"Tours, abbazia di San Martino",intro:"\xC8 l\u2019anno 803. Carlo Magno \xE8 imperatore da tre anni. A Tours, sulle rive del fiume Loira, c\u2019\xE8 la grande [[abbazia]] di San Martino. Qui vive un vecchio maestro famoso in tutto l\u2019impero: Alcuino di York.",firstThought:"Che pace\u2026 Sento una campana e un canto lontano. Davanti a me c\u2019\xE8 un monastero, e dietro una chiesa enorme con una torre. \xC8 un pomeriggio d\u2019autunno: le foglie cadono.",outro:"Hai visto le scuole volute da Carlo Magno, dove monaci, preti e figli dei nobili imparano bene il latino. Hai conosciuto Alcuino, che ha curato la revisione della Bibbia, e la nuova scrittura chiara: la minuscola carolina. Il prossimo viaggio ti porta in campagna, in una [[curtis]], nell\u2019810.",menuCam:{r:20,h:8,look:[0,7,-6]},ambience:{wind:.3,birds:.75,chant:.55,water:.35,bell:45,insects:.15,mode:"dorian"},relics:[{id:"t-tavoletta",name:"Tavoletta di cera e stilo",short:"Su un banco della scuola",text:"Due tavolette di legno legate come un libretto, coperte di cera scura. Con la punta dello [[stilo]] si scrive, con la parte piatta si cancella. \xC8 il quaderno degli scolari: la [[pergamena]] costa troppo per gli esercizi."},{id:"t-penna",name:"Penna d\u2019oca e corno dell\u2019inchiostro",short:"Su un leggio dello scriptorium",text:"Il copista intinge la penna d\u2019oca nell\u2019inchiostro, tenuto in un corno di bue infilato nel leggio. Ogni tanto rif\xE0 la punta alla penna con un coltellino. L\u2019inchiostro scuro si prepara con le galle della quercia."},{id:"t-pagina",name:"Una pagina della Bibbia di Alcuino",short:"Sul tavolo della biblioteca",text:"Un foglio di pergamena scritto in [[minuscola carolina]], con il [[capolettera]] rosso e oro. Le Bibbie corrette da Alcuino e copiate qui a Tours partono verso molte chiese e monasteri dell\u2019impero."}],quiz:[{q:"Chi studiava nelle scuole dei monasteri e delle cattedrali, e che cosa imparava soprattutto?",a:["I monaci, i preti e i figli dei nobili: imparavano bene il latino","Tutti i bambini dei villaggi: imparavano a coltivare i campi","Solo i soldati: imparavano a combattere"],ok:0,hint:"Ripensa alla scuola del monastero: chi sedeva sui banchi? E in che lingua scriveva Ugo sulla tavoletta?",why:"Esatto. Carlo Magno li fece studiare per imparare bene il latino, la lingua della Chiesa e dell\u2019am e che i monaci, i preti e i figli dei nobili studino nelle scuole dei monasteri e delle [[cattedrali|cattedrale]]. Devono imparare bene il [[latino]].","TU: Perch\xE9 proprio il latino?","Perch\xE9 \xE8 la lingua della Chiesa: in latino si prega e si legge la [[Bibbia|bibbia]]. Ed \xE8 la lingua dell\u2019[[amministrazione]]: in latino si scrivono le leggi e gli ordini dell\u2019imperatore.","Ma per secoli i libri sono stati copiati male. Ogni copista faceva qualche errore, e chi copiava dopo di lui ripeteva anche quegli errori.","Per questo, per volere di Carlo, ho curato la [[revisione]] della Bibbia: l\u2019ho corretta parola per parola. Tre anni fa ne ho fatto portare una copia all\u2019imperatore.","Una Bibbia corretta deve anche essere scritta in modo chiaro, perch\xE9 tutti la leggano senza sbagliare. Va\u2019 nello [[scriptorium]] e guarda la scrittura dei miei monaci."]});o.npc({id:"maestro",name:"Warino",role:"maestro della scuola del monastero",goal:"Warino, il maestro della scuola",x:-15.9,z:5.15,rot:.15,anim:"talk",look:{...g,robe:"#3a3028",robe2:"#2e2620",hair:5914672,age:.45,staff:!0,seed:811,height:1.78},lines:["Silenzio, ragazzi! Abbiamo un ospite. Entra pure: questa \xE8 la scuola del monastero.","Qui imparano a leggere e a scrivere i giovani [[monaci|monaco]], i futuri preti e alcuni figli di nobili. L\u2019imperatore Carlo vuole scuole nei monasteri e nelle [[cattedrali|cattedrale]].","Si comincia dai salmi, imparati a memoria. Poi la [[grammatica]] latina: lettere, parole, frasi. Si scrive sulla [[tavoletta di cera]]: costa poco e si cancella.","La [[pergamena]] invece costa moltissimo: quella serve per i libri veri, nello scriptorium. Parla con Ugo, il mio allievo pi\xF9 chiacchierone."]}),o.npc({id:"ugo",name:"Ugo",role:"allievo, figlio di un conte",goal:"Ugo, l\u2019allievo figlio di nobile",x:-12.6,z:11.2,rot:Math.PI/2+.3,anim:"idle",look:{dress:"tunic",robe:"#3a5a8a",legs:"#6a5440",belt:"#3a2414",cloak:"#8a3a22",trim:["#3a5a8a","#d8b04a","diamond"],hair:9067050,hairStyle:"short",height:1.47,seed:812,shoes:3810324},lines:["Ciao! Io sono Ugo. Mio padre \xE8 un [[conte]] dell\u2019imperatore. Mi ha mandato qui a studiare.","TU: Perch\xE9 il figlio di un nobile deve studiare il latino?","Perch\xE9 da grande servir\xF2 l\u2019imperatore. Gli ordini e le leggi arrivano scritti in latino. Un conte che non sa leggere deve sempre fidarsi di qualcun altro!","Guarda la mia tavoletta: ho scritto \xABPater noster\xBB, l\u2019inizio della preghiera. Le lettere sono ancora un po\u2019 storte\u2026 Io preferirei andare a cavallo!"]});let E=o.npc({id:"copista",name:"Adalberto",role:"giovane monaco copista",goal:"Adalberto, il copista",x:18.55,z:9,rot:Math.PI/2,anim:"write",look:{...g,hair:3810840,age:.05,skin:14725264,seed:813,height:1.74},lines:["Piano, per favore\u2026 Sto copiando la Bibbia corretta dall\u2019abate Alcuino. Non devo sbagliare nemmeno una lettera.","Alcuino \xE8 il maestro pi\xF9 importante dell\u2019impero. \xC8 lui che guida, per Carlo, la rinascita degli studi e dei libri.","Scrivo con una penna d\u2019oca, intinta nell\u2019inchiostro dentro questo corno. Ogni tanto le rifaccio la punta con il coltellino.","Guarda la mia pagina: uso la nuova scrittura, la [[minuscola carolina]]. Lettere piccole e rotonde, tutte separate, e uno spazio tra una parola e l\u2019altra.","Prima molti copisti scrivevano in modo fitto e confuso. Guarda le due pagine appese vicino alla porta della biblioteca: capirai subito la differenza."]});o.onUpdate(()=>y(E.model));let U=o.npc({id:"miniatore",name:"Bernardo",role:"monaco miniatore",goal:"Bernardo, il miniatore",x:15.2,z:12.95,rot:.1,anim:"write",look:{...g,robe:"#3a3029",hair:10129544,age:.62,seed:814,height:1.7},lines:["Benvenuto nel mio angolo pieno di colori! Io sono il [[miniatore]]: decoro le pagine con disegni e lettere d\u2019oro.","I colori li preparo io: il rosso dal [[minio]], il verde dal rame, il giallo da una pietra. Li mescolo con il bianco d\u2019uovo. E per l\u2019oro uso foglie sottilissime.","La prima lettera di un libro la faccio grande e colorata: \xE8 il [[capolettera]]. Aiuta il lettore a trovare dove comincia ogni parte.","Una Bibbia intera ha bisogno della pelle di moltissimi animali e di anni di lavoro. Per questo un libro vale tantissimo, quanto un campo o di pi\xF9!"]});o.onUpdate(()=>y(U.model)),o.npc({id:"signora",name:"Adeltrude",role:"giovane moglie di un signore, in pellegrinaggio",goal:"Adeltrude, davanti alla basilica",x:-31.2,z:-9.2,rot:2.4,anim:"idle",look:{female:!0,robe:"#7a2a3a",robe2:"#a8784a",fabric:"linen",hat:"veil",veilColor:"#ece0c4",cloak:"#2e4a6a",cloakType:"mantle",trim:["#7a2a3a","#d8b04a","diamond"],jewel:!0,book:!0,bookColor:6957594,skin:15384736,hair:6961690,height:1.6,seed:815},lines:["Buongiorno! Sono venuta con mio marito a pregare sulla tomba di san Martino. Qui a Tours arrivano [[pellegrini|pellegrino]] da tutto l\u2019impero.","TU: Hai visto la scuola del monastero? \xC8 piena di ragazzi.","S\xEC, ma solo ragazzi. Le ragazze non vanno a scuola. Le bambine imparano a filare, a tessere e a mandare avanti la casa.","Studiano soltanto le ragazze che diventeranno [[monache|monaco]]: imparano a leggere nel loro monastero, per pregare con i libri.","E a volte le mogli dei signori, come me. Io ho imparato a leggere a casa, con un prete che mio padre pagava. Ora leggo i salmi da sola, su questo piccolo libro."]}),M({...g,hair:4861984,height:1.5,seed:21},-18.2,7.25,Math.PI,"sit",{r:.3}),M({dress:"tunic",robe:"#8a3a22",legs:"#5a4a38",belt:"#3a2414",hair:13148256,hairStyle:"short",height:1.42,seed:22},-15,7.25,Math.PI,"sit",{r:.3}),M({...g,hair:2759184,height:1.55,seed:23},-16.2,9.65,Math.PI,"sit",{r:.3}),M({dress:"tunic",robe:"#4a6a3a",legs:"#6a5a40",belt:"#3a2414",hair:3810324,hairStyle:"curly",height:1.4,seed:24},-17.4,12.05,Math.PI,"sit",{r:.3}),M({...g,hair:6965802,age:.3,seed:31},18.55,5.5,Math.PI/2,"sitwrite",{r:.35}),M({...g,hair:2759698,age:.5,seed:32},18.55,12.5,Math.PI/2,  [[servi|servo]].","Oltre il fosso e la siepe, invece, c\u2019\xE8 la [[pars massaricia]]. \xC8 divisa in tanti poderi, i [[mansi|manso]]. Ogni manso \xE8 affidato a una famiglia di contadini, i [[coloni|colono]].","Io scrivo tutto nel [[polittico]]: chi lavora, quanto deve dare, quando. Guarda la tavola dipinta qui accanto: si capisce meglio. Poi va\u2019 pure a vedere i campi, il mulino e i mansi."]}),o.npc({id:"mappa",name:"la tavola dipinta",role:"la curtis vista dall\u2019alto",verb:"Osserva",goal:"la tavola dipinta della curtis, nel cortile",model:g,x:-8.3,z:-.4,rot:.95,markerY:2.6,lines:["TU: Su questa tavola di legno qualcuno ha dipinto la curtis vista dall\u2019alto, come la vedrebbe un uccello.","Al centro c\u2019\xE8 la palizzata, con la [[casa dominica]] e il granaio. Intorno, in giallo, ci sono i campi, la vigna e il prato del padrone: \xE8 la [[pars dominica]].","In basso a sinistra, oltre la siepe, c\u2019\xE8 una zona verde divisa in quadrati con un numero. \xC8 la [[pars massaricia]]: ogni quadrato \xE8 un [[manso]], il podere di una famiglia di coloni.","Tutto intorno ci sono il bosco, il torrente con il mulino e una sola strada. Quasi tutto quello che serve sta qui dentro!"]}),o.npc({id:"colono",name:"Ermenaldo",role:"colono, con la sua parte del raccolto",goal:"Ermenaldo, il colono, accanto al carro",x:T.x+2.5,z:T.z+.2,rot:-1.3,look:{dress:"tunic",robe:"#7a6a48",legs:"#cbbd9c",shoes:4861984,belt:"#3a2a1a",beard:!0,hairStyle:"short",hair:6965802,brows:5913120,skin:12618338,age:.4,seed:803,height:1.72},lines:["Ecco fatto: tre sacchi di grano, una cesta di uova e tre polli. \xC8 la parte del raccolto che devo al padrone. Il fattore conta tutto, sai? Non gli sfugge niente!","TU: Perch\xE9 devi dare al padrone una parte del tuo raccolto?","Sono Ermenaldo, un [[colono]]. Sono un uomo libero, ma la terra non \xE8 mia. Il padrone mi ha dato un [[manso]] in affitto: una casa, un orto e qualche campo, oltre la siepe.","Per pagare l\u2019affitto, ogni anno  combatt\xE9 una grande battaglia tra i nipoti di Carlo Magno: Ludovico e Carlo contro Lotario.",lotaringia:"La parte di mezzo dell\u2019impero, data a Lotario: una lunga striscia di terre dal mare del Nord fino alle Alpi, con Aquisgrana.","regno d\u2019italia":"Il regno che comprende gran parte dell\u2019Italia del Nord e del Centro, con capitale Pavia.","franchi occidentali":"Il regno dei Franchi a ovest, dato a Carlo il Calvo. Pi\xF9 o meno corrisponde alla Francia di oggi.","franchi orientali":"Il regno dei Franchi a est, dato a Ludovico il Germanico. Pi\xF9 o meno corrisponde alla Germania di oggi.",disgregato:"Diviso in tanti pezzi, che non stanno pi\xF9 insieme.",denaro:"La moneta d\u2019argento dei Franchi. Era piccola e sottile.",giuramento:"Una promessa solenne fatta davanti a Dio e a dei testimoni.","lingua romanza":"Lingua nata dal latino parlato dalla gente comune. Da queste lingue nasceranno il francese, l\u2019italiano, lo spagnolo\u2026","lingua germanica":"Lingua dei popoli germanici, come i Franchi dell\u2019Est, i Sassoni, i Bavari. Da queste lingue nascer\xE0 il tedesco.",soprannome:"Un nome in pi\xF9, che si d\xE0 a una persona per una sua caratteristica: per esempio \xABil Pio\xBB, \xABil Calvo\xBB, \xABil Germanico\xBB.",baviera:"Regione nel sud della Germania di oggi, con le Alpi a sud e il fiume Danubio."}),Yd(a,n,i)}};var qa=[js,el,il,rl,cl,yl,gl,vl,zl,Pl,kl,Rl];var ur={glossario:"Elenco di parole difficili con la loro spiegazione. Nel gioco le trovi tutte nel Diario, alla voce \xABParole\xBB.",medioevo:"Il lungo periodo della storia che va dalla caduta dell\u2019Impero romano d\u2019Occidente (476) alla scoperta dell\u2019America (1492).","impero romano":"Il grande Stato governato da Roma. Nel 476 la parte occidentale finisce; quella orientale, con capitale Costantinopoli, continua per altri mille anni.",commercio:"Comprare, vendere e scambiare merci. Per farlo servono strade sicure, monete e citt\xE0 piene di gente.",sostentamento:"Tutto
